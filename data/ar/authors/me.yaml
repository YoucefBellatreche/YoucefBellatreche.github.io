role: أستاذ محاضر قسم «أ» (تأهيل جامعي) في العلوم الاقتصادية
bio: أستاذ محاضر قسم «أ» حاصل على التأهيل الجامعي بجامعة الجزائر 3، ودكتور في العلوم الاقتصادية من معهد الدراسات الأوروبية، جامعة باريس 8 فانسان. تتمحور أبحاثي حول التوجيه والإدماج المهني لحاملي الشهادات الجدد، والتشغيل والبطالة والدخل، والمقاولاتية وإنشاء المؤسسات، والتنمية الاقتصادية في البلدان النامية، وسياسات التكامل الإقليمي بين الشمال والجنوب. وأنا منذ سنة 2025 مسؤول مركز تطوير المسار المهني (CDC) بالجامعة. ويشمل مساري أيضًا عدة سنوات من الخبرة في عالم الأعمال، في تسيير المؤسسات والتجارة الدولية بين أوروبا والمغرب العربي.
