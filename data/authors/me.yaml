bio: Maître de conférences habilité à diriger des recherches à l'Université Alger 3 et docteur en sciences économiques de l'Institut d'études européennes, Université Paris 8 Vincennes, je travaille sur l'orientation et l'insertion professionnelles des jeunes diplômés, l'emploi, le chômage et le revenu, l'entrepreneuriat et la création d'entreprises, le développement économique des pays en développement et les politiques d'intégration régionale Nord-Sud. Je suis, depuis 2025, responsable du Centre de développement de carrières (CDC) de l'université. Mon parcours comprend aussi plusieurs années d'expérience dans le monde des affaires, en gestion d'entreprise et en commerce international entre l'Europe et le Maghreb.
