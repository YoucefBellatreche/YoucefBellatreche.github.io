role: Associate Professor of Economics (Maître de conférences A, HDR)
bio: I am an Associate Professor (Maître de conférences, class A) with the habilitation to supervise research (HDR) at the University of Algiers 3, and hold a PhD in Economics from the Institute of European Studies, Paris 8 Vincennes University. My research covers career guidance and the labour-market integration of young graduates; employment, unemployment and income; entrepreneurship and business creation; economic development in developing countries; and North–South regional integration policies. Since 2025 I have been Head of the university's Career Development Centre (CDC). My background also includes several years of experience in the business world, in company management and international trade between Europe and the Maghreb.
